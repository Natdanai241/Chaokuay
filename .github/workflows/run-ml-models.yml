name: Run ML models

on:
  workflow_dispatch: {}

jobs:
  ml-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/run-ml-models.js
        env:
          SUPABASE_URL: https://aaphdwailaktncopxnrp.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
